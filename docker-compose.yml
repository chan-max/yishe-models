services:
  yishe-models:
    build: .
    container_name: yishe-models
    ports:
      - "8900:8900"
    volumes:
      - ./models:/app/models
    environment:
      - PORT=8900
      - NODE_ENV=production
      - JSON_BODY_LIMIT=8mb
      - INFERENCE_CONCURRENCY=1
      - INFERENCE_MAX_QUEUE=8
      - MAX_BATCH_SIZE=32
      - MAX_IMAGE_BATCH_SIZE=4
    mem_limit: 2g
    mem_swappiness: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8900/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - yishe-network

networks:
  yishe-network:
    driver: bridge
